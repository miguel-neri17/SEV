{% extends 'estoque/base.html' %}

{% block title %}Confirmar exclusão — SEV{% endblock %}

{% block content %}
  <div class="panel">
    <h1>Confirmar exclusão</h1>
    <p>Tem certeza que deseja excluir <strong>{{ objeto }}</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <button class="btn dangerbtn" type="submit">Sim, excluir</button>
      <a class="btn secondary" href="{% url voltar %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
