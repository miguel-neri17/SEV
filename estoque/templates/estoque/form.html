{% extends 'estoque/base.html' %}

{% block title %}{{ titulo }} — SEV{% endblock %}

{% block content %}
  <h1>{{ titulo }}</h1>

  <form method="post" class="form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="btn" type="submit">Salvar</button>
    <a class="btn secondary" href="{% url voltar %}">Cancelar</a>
  </form>
{% endblock %}
